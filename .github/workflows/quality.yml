name: Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.3' ]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Syntax check
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # Runs on both PHP versions: the logic under test has to behave the same
      # on the oldest version the plugin supports and the newest.
      - name: Tests
        run: composer test

      # The coding standard and static analysis only need to run once.
      # A known vulnerability in a dependency is a vulnerability in the
      # plugin, and nothing surfaces one unless something asks.
      - name: Audit PHP dependencies
        run: composer audit

      - name: Coding standards
        if: matrix.php == '8.3'
        run: composer lint

      - name: Static analysis
        if: matrix.php == '8.3'
        run: composer analyse

  js:
    name: JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint:js
      - run: npm run test:js
      - run: npm audit --audit-level=high

      # A minified file that no longer matches its source is served to every
      # visitor while the repository shows something else, so the build is run
      # again here and any difference fails.
      - name: Assert the minified assets are current
        run: |
          npm run build:assets
          git diff --exit-code -- assets/             || { echo "::error::assets/*.min.* are stale. Run npm run build:assets and commit."; exit 1; }

  release-package:
    name: Release package builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # A relative output path, matching what the deploy workflow passes.
      - name: Build the wp.org ZIP
        run: bash scripts/build-release.sh --output-dir=build

      # The self-hosted updater is prohibited by wp.org guideline #8, so the
      # release package must never contain it.
      - name: Assert the updater is excluded
        run: |
          zip="$(find build -name '*.zip' | head -n1)"
          if unzip -Z1 "$zip" | grep -q 'class-updater.php'; then
            echo "::error::class-updater.php leaked into the wp.org package"
            exit 1
          fi
          # A previous build left in the tree must not end up inside the next one.
          if unzip -Z1 "$zip" | grep -qE '\.zip$'; then
            echo "::error::a ZIP was packaged inside the release package"
            exit 1
          fi
          echo "Package contents verified: $zip"

      # The update manifest publishes a checksum of the package, so identical
      # code has to produce identical bytes. Otherwise a rebuild invalidates a
      # manifest that is still correct and the updater refuses a good download.
      - name: Assert the build is reproducible
        run: |
          first="$(sha256sum build/*.zip | cut -d' ' -f1)"
          rm -rf build
          sleep 2
          bash scripts/build-release.sh --output-dir=build
          second="$(sha256sum build/*.zip | cut -d' ' -f1)"

          if [ "$first" != "$second" ]; then
            echo "::error::two builds of the same code produced different packages"
            echo "  $first"
            echo "  $second"
            exit 1
          fi

          echo "Reproducible: $first"
