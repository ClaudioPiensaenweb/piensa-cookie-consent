name: Deploy to WordPress.org

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # The tag, the plugin header and the readme stable tag must agree, or
      # wp.org will serve a version that does not match the code.
      - name: Verify version consistency
        run: bash scripts/check-version.sh

      - name: Build the release package
        id: package
        run: |
          bash scripts/build-release.sh --output-dir=build
          echo "path=$(find build -name '*.zip' | head -n1)" >> "$GITHUB_OUTPUT"

      # The plugin has to be approved by the directory before SVN exists to
      # push to. Until the credentials are set, build and attach the ZIP but
      # skip the upload rather than failing the release.
      - name: Check for directory credentials
        id: credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -n "$SVN_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SVN_USERNAME is not set, so the upload to WordPress.org was skipped."
          fi

      - name: Deploy to the WordPress.org plugin directory
        if: steps.credentials.outputs.available == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: piensa-cookie-consent
          ASSETS_DIR: .wordpress-org

      - name: Attach the ZIP to the GitHub release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.path }}
