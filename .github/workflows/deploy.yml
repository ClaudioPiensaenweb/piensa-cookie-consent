name: Deploy

on:
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build packages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The tag, the plugin header and the readme stable tag must agree, or
      # wp.org will serve a version that does not match the code.
      - name: Verify version consistency
        run: bash scripts/check-version.sh

      - name: Read the version
        id: version
        run: echo "value=$(awk '/^Stable tag:/ {print $3; exit}' readme.txt)" >> "$GITHUB_OUTPUT"

      # Two packages, deliberately. The wp.org one has no self-hosted updater,
      # which guideline #8 requires; the agency one does. A client updating to
      # the wrong one would silently stop receiving updates.
      - name: Build both packages
        run: |
          bash scripts/build-release.sh --output-dir=build
          bash scripts/build-release.sh --keep-updater --suffix=agency --output-dir=build

      - name: Build the update manifest
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          bash scripts/build-update-manifest.sh \
            --zip="build/piensa-cookie-consent-${{ steps.version.outputs.value }}-agency.zip" \
            --version="${{ steps.version.outputs.value }}" \
            --repo="${{ github.repository }}" \
            --output=build/pages/update.json

      - name: Attach both packages to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/piensa-cookie-consent-${{ steps.version.outputs.value }}.zip
            build/piensa-cookie-consent-${{ steps.version.outputs.value }}-agency.zip

      - name: Upload the manifest for publishing
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  publish-manifest:
    name: Publish the update manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Serving the manifest from Pages means there is no update server to run:
      # the agency build polls a static file over HTTPS.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  wordpress-org:
    name: Publish to WordPress.org
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # The plugin has to be approved by the directory before SVN exists to
      # push to. Until the credentials are set, skip the upload rather than
      # failing the release.
      - name: Check for directory credentials
        id: credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
        run: |
          if [ -n "$SVN_USERNAME" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SVN_USERNAME is not set, so the upload to WordPress.org was skipped."
          fi

      - name: Deploy to the WordPress.org plugin directory
        if: steps.credentials.outputs.available == 'true'
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: piensa-cookie-consent
          ASSETS_DIR: .wordpress-org
